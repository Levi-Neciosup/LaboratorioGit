<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nexo</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon"></div>
                <h1>nexo</h1>
                <p>TECNOLOGÍA QUE CUIDA</p>
            </div>
            <h2>Bienvenido de nuevo</h2>
            <p class="login-subtitle">Ingresa tus credenciales para acceder al portal.</p>
            
            <!-- Mensaje de error oculto por defecto -->
            <div id="loginError" class="error-msg" style="display: none;">
                ⚠️ Credenciales incorrectas. Inténtalo de nuevo.
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="admin@nexo.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" id="togglePassword" class="toggle-pass">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Ingresar al sistema</button>
            </form>
            
            <div class="login-hints">
                <p><strong>Credenciales de prueba:</strong></p>
                <p>Usuario: <code>admin@nexo.com</code></p>
                <p>Contraseña: <code>123456</code></p>
            </div>
        </div>
    </div>
    <script src="./auth.js"></script>
</body>
</html>
